name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: built_for_cloud_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d built_for_cloud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          # paragonie/paseto hard-requires gmp (and prefers sodium for the
          # v4 primitives); setup-php's default extension set ships
          # neither, so the console assertion verifier would fail to
          # install here while working fine on Laravel Cloud.
          extensions: gmp, sodium, pdo_pgsql
          tools: composer:v2
          coverage: none

      # The console re-entry interceptor is JavaScript, and
      # tests/ConsoleReentryInterceptorTest.php is the only thing that
      # EXECUTES it — through node. Pinned here rather than inherited
      # from whatever the runner image happens to ship: without this
      # step those tests would skip and the lane would stay green on the
      # component carrying the same-origin check.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Run PHPStan
        run: composer stan

      - name: Run Pint
        run: composer lint:test

      - name: Run Tests
        run: composer test
        env:
          BFC_POSTGRES_DATABASE: built_for_cloud_test
          BFC_POSTGRES_HOST: 127.0.0.1
          BFC_POSTGRES_PASSWORD: postgres
          BFC_POSTGRES_USERNAME: postgres

  lowest:
    name: tests (lowest deps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.4'
          # paragonie/paseto hard-requires gmp (and prefers sodium for the
          # v4 primitives); setup-php's default extension set ships
          # neither, so the console assertion verifier would fail to
          # install here while working fine on Laravel Cloud.
          extensions: gmp, sodium
          tools: composer:v2
          coverage: none

      # The console re-entry interceptor is JavaScript, and
      # tests/ConsoleReentryInterceptorTest.php is the only thing that
      # EXECUTES it — through node. Pinned here rather than inherited
      # from whatever the runner image happens to ship: without this
      # step those tests would skip and the lane would stay green on the
      # component carrying the same-origin check.
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      # `update`, not `install`: with no committed lock, `install` resolves the
      # NEWEST version satisfying each constraint, which is exactly the blind
      # spot this lane exists to close (bfc#37). `--prefer-stable` is mandatory
      # alongside `--prefer-lowest` or dev/alpha releases of transitive packages
      # get dragged in and the failures are pure noise.
      - name: Install Lowest Dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist

      # When this lane goes red the first question is always "what did it
      # actually install" — put the answer in the log.
      - name: Show Resolved Versions
        run: composer show laravel/framework | grep '^versions' || composer show laravel/framework

      # Tests only: phpstan and pint at the floor produce version-dependent
      # noise, and both are already covered on the fresh-install lane above.
      - name: Run Tests
        run: composer test
